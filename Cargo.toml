[package]
autotests = false
name = "gufi"
version = "0.2.0-alpha.19"
edition = "2024"
description = "Python runner for Claviron runtime"
publish = true
license = "MIT"
repository = "https://github.com/claviron/gufi"
homepage = "https://github.com/claviron"
documentation = "https://docs.rs/gufi"
keywords = ["python", "asgi", "claviron", "runtime", "websocket"]
categories = ["web-programming::http-server", "api-bindings", "asynchronous"]
include = ["/src/**", "/stubs/**", "/assets/gufi.svg", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE"]
# Carries the linked Python's directory to the application's `build.rs` as
# `DEP_GUFI_PYTHON_LIB_DIR`; see `build.rs`.
links = "gufi"

# Gufi compiles a Python application's own binary against Claviron. It
# reaches Claviron the way any consumer does — through the root facade, never
# its internal crates — which is why it lives beside Claviron, not inside it.
[dependencies]
bytes = { version = "1.11" }
clap = { version = "4", features = ["derive"], optional = true }
async-trait = { version = "0.1" }
pyo3 = { version = "0.30.1" }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = { version = "0.9" }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
claviron = { version = "0.2.0-alpha.19", path = "../claviron", default-features = false, features = [
    "http",
    "runner",
    "supervisor",
    "orbit",
] }
http = { version = "1.4" }
http-body = { version = "1.0" }
http-body-util = { version = "0.1" }
percent-encoding = { version = "2.3" }
thiserror = { version = "2.0" }
tower-service = { version = "0.3" }
tracing = { version = "0.1" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# axum is the default road, the way it is in Claviron: `register` puts the
# interpreter behind your router for you, and the router type comes from
# `claviron::axum` — the one this workspace resolves — so an application never
# negotiates an axum version with this crate.
#
# It is a feature rather than a fixture because the other roads stay open:
# `register_with` needs only `tower-service`, and a warp filter or a bare
# `service_fn` goes through it with no axum in the graph at all.
[dev-dependencies]
tempfile = "3"

[build-dependencies]
# Reads the interpreter PyO3 links; the same version as `pyo3`.
pyo3-build-config = { version = "0.30.1", features = ["resolve-config"] }

[features]
default = ["axum"]
axum = ["claviron/axum"]
# A command line for the application's own `main` to read. Off by default
# because argv belongs to the binary, not to a library: the starter kit turns
# it on where an operator can see the line and delete it.
cli = ["dep:clap", "claviron/runner-cli"]
# Serving HTTPS on a TCP door, and requiring a client certificate on it. Off
# by default: most deployments put this process behind something that already
# terminated TLS.
tls = ["claviron/tls"]
# WebSocket on gufi's own listener, spoken by the runner shell. Over Orbit the edge speaks
# the protocol and this is not needed.
websocket = ["claviron/websocket"]
# LEGACY_LINUX: run on Linux kernels older than 5.3 (AlmaLinux 8's 4.18),
# which have no pidfd for watching worker processes. Off by default.
legacy-linux = ["claviron/legacy-linux"]
# Two Rust routes to measure your own against. Off by default: routes an
# application did not write do not belong in production by accident.
bench = ["axum", "claviron/bench"]
metrics = ["claviron/metrics"]
# Claviron's broadcast service in this process: Pusher-compatible channels a
# browser subscribes to with pusher-js or Laravel Echo, reached over Orbit, and
# `gufi.broadcast(...)` for the application to publish in process, with no
# HTTP round trip. Built in, the service runs and reads `broadcast.yaml` beside
# the application; off by default, so an application that broadcasts nothing
# carries none of it.
broadcast = ["claviron/broadcast"]
# Django additions, under `src/django/`: Channels' channel layer
# (`gufi.channels.OrbitChannelLayer`) over the broadcast service's groups,
# configured by `broadcasting.channels` in gufi.yaml. The project installs
# `channels` and `msgpack` itself.
django = ["broadcast"]
# Static mounts in front of the application (`files:` in gufi.yaml), served by
# Claviron's file service — what runserver's static handling or WhiteNoise
# does, for a process no edge stands in front of. No edge comes with it.
files = ["axum", "claviron/files"]
# Claviron's log pipeline for this application's fleet: the channels
# `logging.yaml` beside it declares, written by the master's one writer, and
# `gufi.LogHandler` putting Python's `logging` on them — what the
# `claviron` log driver is to Laravel. `log-otlp` adds the OTLP adapter.
log = ["claviron/log-pipeline"]
log-otlp = ["log", "claviron/log-otlp"]
# Development's reload: the master watches the application's Python with the
# platform's native notifications and asks for a rolling worker restart on a
# change. Needs two or more workers; production carries no watcher.
watch = ["claviron/runner-watch"]

# Claviron's release settings, so what this crate measures on its own — its
# benches — is built the way the binaries that embed it are. A library's
# profile applies only when it is the root being built; the application's
# own profile governs it everywhere else. No `strip`: a profiler needs the
# symbols.
[profile.release]
codegen-units = 1
debug = 0
incremental = false
lto = "thin"
opt-level = 3
panic = "unwind"
