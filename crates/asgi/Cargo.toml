[package]
name = "gufi-asgi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embeddable Python ASGI engine with lifespan, streaming HTTP and message sessions"
keywords = ["python", "asgi", "claviron", "embedding", "websocket"]
categories = ["web-programming::http-server", "api-bindings", "asynchronous"]
autotests = false
links = "gufi_asgi"
include = ["/src/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = []
broadcast = ["claviron/broadcast"]
django = ["broadcast", "dep:serde"]
log = ["claviron/log-pipeline"]

[dependencies]
bytes = "1.11"
claviron = { workspace = true, features = ["http", "application", "orbit"] }
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
percent-encoding = "2.3"
pyo3 = "0.30.1"
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
tower-service = "0.3"

[build-dependencies]
pyo3-build-config = { version = "0.30.1", features = ["resolve-config"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
